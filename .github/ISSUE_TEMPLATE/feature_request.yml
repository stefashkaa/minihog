name: Feature Request
description: Suggest an idea for this project
labels: enhancement
body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request: Please describe your idea and use case.
  - type: input
    id: title
    attributes:
      label: Feature Title
      description: Short, descriptive title of the feature
      placeholder: Add route-based session replay exclusions
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the feature? Why is it needed?
      placeholder: Allow applications to exclude selected routes from session recording
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: Use Case
      description: Why do you need this feature?
      placeholder: Record onboarding sessions while excluding billing and account settings pages
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like to see this implemented?
      placeholder: Add a replay URL exclusion option that applies on initial load and SPA navigation
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other solutions have you considered?
      placeholder: Manually stopping and restarting recording in router hooks
    validations:
      required: false
  - type: textarea
    id: examples
    attributes:
      label: Examples from Other Libraries
      description: Reference similar features elsewhere
      placeholder: Link to a similar replay filtering API and explain the behavior you need
    validations:
      required: false
