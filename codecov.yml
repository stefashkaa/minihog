codecov:
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        target: 95%
        threshold: 0%
    patch:
      default:
        target: 95%
        threshold: 0%

comment:
  layout: 'reach,diff,flags,tree'
  behavior: default
  require_changes: true

ignore:
  - '**/*.d.ts'
  - '**/dist/**'
  - '**/tests/**'
  - 'demo/**'
